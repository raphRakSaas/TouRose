name: Preview Deployments

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apps/website/**'
      - 'apps/admin/**'
      - 'packages/**'
      - '.github/workflows/preview.yml'

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-website:
    name: Deploy website (Cloudflare Pages)
    runs-on: ubuntu-latest
    if: ${{ vars.WEBSITE_DEPLOY_ENABLED == 'true' }}
    environment: production
    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      IMPORT_CRON_SECRET: ${{ secrets.IMPORT_CRON_SECRET }}
      PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write production client env
        run: node ./scripts/write-production-env.mjs

      - name: Build website
        run: pnpm --filter @tourose/website build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT_WEBSITE }}
          directory: apps/website/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  hosting-not-configured:
    name: Preview skipped (hosting not configured)
    runs-on: ubuntu-latest
    if: ${{ vars.WEBSITE_DEPLOY_ENABLED != 'true' }}
    steps:
      - name: Explain next steps
        run: |
          echo "::warning::WEBSITE_DEPLOY_ENABLED is not set to true — no deployment ran."
          echo ""
          echo "Configure GitHub (Settings → Secrets and variables → Actions):"
          echo "  Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SUPABASE_URL, SUPABASE_ANON_KEY, IMPORT_CRON_SECRET"
          echo "  Variables: WEBSITE_DEPLOY_ENABLED=true, CLOUDFLARE_PAGES_PROJECT_WEBSITE=sereno-site-aqy, PUBLIC_SITE_URL=https://sereno-site-aqy.pages.dev"
          echo ""
          echo "Or tag a release: git tag v0.1.4 && git push origin v0.1.4"
          echo "See DOCS/PRODUCTION-DEPLOY.md"
