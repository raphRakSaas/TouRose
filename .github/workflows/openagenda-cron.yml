name: OpenAgenda cron

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  import-and-health:
    runs-on: ubuntu-latest
    if: ${{ vars.OPENAGENDA_CRON_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cron tick (import + health + push on Friday)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          IMPORT_CRON_SECRET: ${{ secrets.IMPORT_CRON_SECRET }}
        run: pnpm cron:tick -- --with-push
