# Deprecated — use `.github/workflows/release.yml` (tag `v*`).

name: Production Migrations (legacy)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to acknowledge production migration risk'
        required: true
        type: string

jobs:
  redirect:
    name: Use release workflow instead
    runs-on: ubuntu-latest
    steps:
      - name: Guard
        run: |
          if [ "${{ inputs.confirm }}" != "APPLY" ]; then
            echo "Confirmation token mismatch. Aborting."
            exit 1
          fi
          echo "This workflow is deprecated."
          echo "Tag a release instead: git tag v0.1.0 && git push origin v0.1.0"
          echo "See docs/PRODUCTION-DEPLOY.md"
          exit 1
