    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    // artifact, so window.top can be a FOREIGN document — a top-addressed

    // "page text" from it, minting attacker HTML as an artifact-origin

    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const resourceBlobs = {};

      const u = URL.createObjectURL(pageBlob);

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:100px;pointer-events:none;\">Gratuit<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:18px;\"><div style=\"font-family:'Fraunces',serif;font-weight:700;font-size:17px;margin-bottom:6px;\">Quais de la Garonne<\u002Fdiv><div style=\"font-size:14px;color:#5C554D;margin-bottom:6px;\">Balade · vue sur le Pont-Neuf<\u002Fdiv><div style=\"font-size:12px;color:#756C60;\">Vérifié le 8 juillet<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isCatCollections }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px;\" class=\"tr-grid-4\">\n          <div sc-camel-on-click=\"{{ openDetailCollection }}\" class=\"tr-card\" style=\"border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(31,28,25,.06);\">\n            <div style=\"height:140px;\"><image-slot id=\"cat-col-1\" placeholder=\"Photo\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"padding:16px;font-weight:600;font-size:15px;\">Toulouse gratuitement<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ openDetailCollection }}\" class=\"tr-card\" style=\"border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(31,28,25,.06);\">\n            <div style=\"height:140px;\"><image-slot id=\"cat-col-2\" placeholder=\"Photo\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"padding:16px;font-weight:600;font-size:15px;\">Sorties quand il pleut<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ openDetailCollection }}\" class=\"tr-card\" style=\"border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(31,28,25,.06);\">\n            <div style=\"height:140px;\"><image-slot id=\"cat-col-3\" placeholder=\"Photo\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"padding:16px;font-weight:600;font-size:15px;\">Fraîcheur et lieux ombragés<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ open <\u002Fdiv>\n            <div style=\"font-size:14px;color:#5C554D;line-height:1.5;\">Oui, ici on dit chocolatine. Tu viens de financer une pause très toulousaine.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 8px rgba(31,28,25,.08);\">\n            <div style=\"font-family:'Fraunces',serif;font-weight:700;font-size:26px;color:#A94A30;margin-bottom:8px;\">10 €<\u002Fdiv>\n            <div style=\"font-weight:700;font-size:16px;margin-bottom:8px;\">Une brique rose<\u002Fdiv>\n            <div style=\"font-size:14px;color:#5C554D;line-height:1.5;\">Une brique symbolique pour construire la prochaine fonctionnalité.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ confirmSupport }}\" class=\"tr-btn\" style=\"margin-top:36px;display:inline-block;background:#C45C3E;color:#fff;font-weight:600;font-size:16px;padding:15px 32px;border-radius:16px;cursor:pointer;\">Soutenir<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isSupportThanks }}\">\n      <div style=\"max-width:600px;margin:0 auto;padding:100px 40px;text-align:center;\">\n        <svg width=\"96\" height=\"96\" sc-camel-view-box=\"0 0 96 96\" style=\"animation:tr-circleIn .5s cubic-bezier(.2,.9,.3,1.4) both;margin-bottom:24px;\">\n          <circle cx=\"48\" cy=\"48\" r=\"46\" fill=\"#C45C3E\"><\u002Fcircle>\n          <path class=\"tr-check-path\" d=\"M28 50l12 12 28-28\" fill=\"none\" stroke=\"#FBF1EC\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n        <\u002Fsvg>\n        <h1 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:30px;margin:0 0 14px;\">Merci, sincèrement<\u002Fh1>\n        <p style=\"font-size:16px;color:#5C554D;line-height:1.6;margin:0 0 28px;\">Ta brique rose est posée. On continue à construire TouRose avec le même soin.<\u002Fp>\n        <div sc-camel-on-click=\"{{ closeSupport }}\" class=\"tr-nav-link\" style=\"border:1.5px solid #C45C3E;color:#8A3B26;font-weight:600;font-size:15px;padding:12px 24px;border-radius:16px;display:inline-block;cursor:pointer;\">Retour<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <!-- CONFIDENTIALITE -->\n  <sc-if value=\"{{ isConfidentialite }}\">\n    <div style=\"max-width:760px;margin:0 auto;padding:72px 40px 100px;\">\n      <h1 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:34px;margin:0 0 16px;\">Confidentialité<\u002Fh1>\n      <p style=\"font-size:16px;line-height:1.7;color:#5C554D;margin:0 0 40px;\">TouRose est pensé pour fonctionner sans compte. Voici, clairement, ce que ça veut dire.<\u002Fp>\n\n      <h2 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:20px;margin:0 0 10px;\">Compte facultatif<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.7;color:#1F1C19;margin:0 0 28px;\">On ne demande jamais ton nom, ta date de naissance ou tes contacts pour utiliser l'app. Un compte optionnel ne sert qu'à synchroniser tes favoris entre appareils.<\u002Fp>\n\n      <h2 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:20px;margin:0 0 10px;\">Localisation<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.7;color:#1F1C19;margin:0 0 28px;\">Si tu l'autorises, elle sert uniquement à te proposer des idées proches de toi, en temps réel sur ton appareil. Elle n'est jamais revendue ni partagée, et tu peux toujours saisir une adresse à la main à la place.<\u002Fp>\n\n      <h2 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:20px;margin:0 0 10px;\">Soutien &amp; paiement<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.7;color:#1F1C19;margin:0 0 28px;\">Les paiements de soutien sont traités par un prestataire de paiement tiers sécurisé. TouRose ne stocke jamais tes coordonnées bancaires.<\u002Fp>\n\n      <h2 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:20px;margin:0 0 10px;\">Une politique qui évoluera<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.7;color:#1F1C19;margin:0 0 16px;\">Cette page est un point de départ clair : la politique complète, avec le détail juridique, sera publiée ici avant le lancement public.<\u002Fp>\n      <p style=\"font-size:15px;color:#756C60;\">Une question sur tes données ? <a href=\"#\">Écris-nous<\u002Fa>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- CREDITS -->\n  <sc-if value=\"{{ isCredits }}\">\n    <div style=\"max-width:760px;margin:0 auto;padding:72px 40px 100px;\">\n      <h1 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:34px;margin:0 0 24px;\">Crédits &amp; sources<\u002Fh1>\n      <p style=\"font-size:16px;line-height:1.7;color:#1F1C19;margin:0 0 28px;\">TouRose s'appuie sur des données publiques et des contributions locales. Chaque fiche indique sa source et sa date de vérification.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:0;margin-bottom:36px;\">\n        <div style=\"padding:16px 0;border-bottom:1px solid #EDE0CB;display:flex;justify-content:space-between;\"><span style=\"font-weight:600;\">Ville de Toulouse — open data<\u002Fspan><span style=\"color:#756C60;font-size:14px;\">Lieux &amp; monuments<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:16px 0;border-bottom:1px solid #EDE0CB;display:flex;justify-content:space-between;\"><span style=\"font-weight:600;\">Contributeurs de la carte<\u002Fspan><span style=\"color:#756C60;font-size:14px;\">Fond de carte<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:16px 0;border-bottom:1px solid #EDE0CB;display:flex;justify-content:space-between;\"><span style=\"font-weight:600;\">Organisateurs locaux<\u002Fspan><span style=\"color:#756C60;font-size:14px;\">Événements<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:16px 0;display:flex;justify-content:space-between;\"><span style=\"font-weight:600;\">Photographies<\u002Fspan><span style=\"color:#756C60;font-size:14px;\">Créditées individuellement sur chaque fiche<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <h2 style=\"font-family:'Fraunces',serif;font-weight:700;font-size:20px;margin:0 0 10px;\">Un lieu erroné, une photo à retirer ?<\u002Fh2>\n      <p style=\"font-size:15px;line-height:1.7;color:#1F1C19;margin:0;\">Chaque fiche a un bouton « Signaler une erreur ». On corrige au plus vite — TouRose vit de ces signalements.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <div style=\"border-top:1px solid #EDE0CB;background:#fff;\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:56px 40px 32px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;\" class=\"tr-footer-grid\">\n      <div>\n        <div style=\"font-family:'Fraunces',serif;font-weight:700;font-size:20px;color:#A94A30;margin-bottom:10px;\">TouRose<\u002Fdiv>\n        <div style=\"font-size:14px;color:#5C554D;line-height:1.6;max-width:260px;\">Trois idées adaptées à ta situation, puis tout Toulouse à portée de main.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#756C60;margin-bottom:14px;\">Explorer<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;\">\n          <span sc-camel-on-click=\"{{ goCatalogue }}\" class=\"tr-nav-link\" style=\"color:#1F1C19;\">Catalogue<\u002Fspan>\n          <span style=\"color:#1F1C19;\">Carte — dans l'app<\u002Fspan>\n          <span style=\"color:#1F1C19;\">Collections éditoriales<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#756C60;margin-bottom:14px;\">TouRose<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;\">\n          <span sc-camel-on-click=\"{{ goSoutenir }}\" class=\"tr-nav-link\" style=\"color:#1F1C19;\">Soutenir<\u002Fspan>\n          <span sc-camel-on-click=\"{{ goCredits }}\" class=\"tr-nav-link\" style=\"color:#1F1C19;\">Crédits &amp; sources<\u002Fspan>\n          <span sc-camel-on-click=\"{{ goConfidentialite }}\" class=\"tr-nav-link\" style=\"color:#1F1C19;\">Confidentialité<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#756C60;margin-bottom:14px;\">Contact<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;\">\n          <a href=\"#\">bonjour@tourose.app<\u002Fa>\n          <span style=\"color:#1F1C19;\">Signaler une erreur<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1200px;margin:0 auto;padding:20px 40px 32px;border-top:1px solid #EDE0CB;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;\">\n      <span style=\"font-size:13px;color:#756C60;\">© 2026 TouRose · Fait avec soin à Toulouse.<\u002Fspan>\n      <span style=\"font-size:13px;color:#756C60;\">Sans compte obligatoire, toujours.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- DETAIL OVERLAY -->\n  <sc-if value=\"{{ isDetailEvent }}\">\n    <div style=\"position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:40px;\">\n      <div sc-camel-on-click=\"{{ closeDetail }}\" style=\"position:absolute;inset:0;background:rgba(31,28,25,.5);animation:tr-fadeIn .2s ease-out both;\"><\u002Fdiv>\n      <div style=\"position:relative;background:#FBF8F4;border-radius:24px;max-width:600px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:tr-fadeUp .25s ease-out both;\">\n        <div style=\"position:relative;height:260px;\"><image-slot id=\"detail-event-hero\" placeholder=\"Photo\"><\u002Fimage-slot>\n          <div sc-camel-on-click=\"{{ closeDetail }}\" style=\"position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;\">✕<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:28px 32px 36px;\">\n          <div style=\"font-family:'Fraunces',serif;font-weight:700;font-size:24px;margin-bottom:12px;\">Nocturne du Muséum<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px;color:#1F1C19;margin-bottom:22px;\">\n            <div>Jeu. 23 juillet · 19h–23h<\u002Fdiv>\n            <div>Muséum de Toulouse · à 12 min en métro<\u002Fdiv>\n            <div>9 € · tarif réduit disponible<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;margin-bottom:24px;\">\n            <div class=\"tr-btn\" style=\"background:#C45C3E;color:#fff;font-weight:600;font-size:14px;padding:12px 20px;border-radius:14px;cursor:pointer;\">Favori<\u002Fdiv>\n            <div class=\"tr-btn\" style=\"border:1.5px solid #EDE0CB;font-weight:600;font-size:14px;padding:11px 20px;border-radius:14px;cursor:pointer;\">Lien officiel<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.7;color:#1F1C19;margin-bottom:16px;\">Une soirée exceptionnelle dans les collections du Muséum, avec visites guidées et animations pour petits et grands.<\u002Fdiv>\n          <div style=\"font-size:13px;color:#756C60;\">Source : Muséum de Toulouse · vérifié le 12 juillet · <a href=\"#\">Signaler une erreur<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ isDetailLieu }}\">\n    <div style=\"position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:40px;\">\n      <div sc-camel-on-click=\"{{ closeDetail }}\" style=\"position:absolute;inset:0;background:rgba(31,28,25,.5);animation:tr-fadeIn .2s ease-out both;\"><\u002Fdiv>\n      <div style=\"position:relative;background:#FBF8F4;border-radius:24px;max-width:600px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:tr-fadeUp .25s ease-out both;\">\n        <div style=\"position:relative;height:260px;\"><image-slot id=\"detail-lieu-hero\" placeholder=\"Photo\"><\u002Fimage-slot>\n          <div sc-camel-on-click=\"{{ closeDetail }}\" style=\"position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;\">✕<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:28px 32px 36px;\">\n          <div style=\"font-family:'Fraunces',serif;font-weight:700;font-size:24px;margin-bottom:12px;\">Jardin des Plantes<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;\">\n            <div style=\"background:#D3E6E9;color:#26525C;font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;\">Gratuit<\u002Fdiv>\n            <div style=\"background:#F5EEE3;font-size:12px;padding:6px 12px;border-radius:100px;\">1–2 h<\u002Fdiv>\n            <div style=\"background:#F5EEE3;font-size:12px;padding:6px 12px;border-radius:100px;\">Extérieur<\u002Fdiv>\n            <div style=\"background:#F5EEE3;font-size:12px;padding:6px 12px;border-radius:100px;\">Chiens acceptés<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;margin-bottom:24px;\">\n            <div class=\"tr-btn\" style=\"background:#C45C3E;color:#fff;font-weight:600;font-size:14px;padding:12px 20px;border-radius:14px;cursor:pointer;\">Favori<\u002Fdiv>\n            <div class=\"tr-btn\" style=\"border:1.5px solid #EDE0CB;font-weight:600;font-size:14px;padding:11px 20px;border-radius:14px;cursor:pointer;\">Partager<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.7;color:#1F1C19;margin-bottom:16px;\">Un grand jardin ombragé au bord du Canal du Midi, idéal pour une pause au calme ou une balade en famille.<\u002Fdiv>\n          <div style=\"font-size:13px;color:#756C60;\">Source : Ville de Toulouse · vérifié le 12 juillet · <a href=\"#\">Signaler une erreur<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <!-- DETAIL OVERLAY: COLLECTION -->\n  <sc-if value=\"{{ isDetailCollection }}\">\n    <div style=\"position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:40px;\">\n      <div sc-camel-on-click=\"{{ closeDetail }}\" style=\"position:absolute;inset:0;background:rgba(31,28,25,.5);animation:tr-fadeIn .2s ease-out both;\"><\u002Fdiv>\n      <div style=\"position:relative;background:#FBF8F4;border-radius:24px;max-width:680px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:tr-fadeUp .25s ease-out both;\">\n        <div style=\"position:relative;height:200px;\"><image-slot id=\"detail-col-hero\" placeholder=\"Photo\"><\u002Fimage-slot>\n          <div sc-camel-on-click=\"{{ closeDetail }}\" style=\"position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;\">✕<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:28px 32px 36px;\">\n          <div style=\"font-family:'Fraunces',serif;font-weight:700;font-size:24px;margin-bottom:8px;\">Toulouse gratuitement<\u002Fdiv>\n          <div style=\"font-size:15px;color:#5C554D;margin-bottom:24px;\">8 idées pour profiter de la ville sans dépenser un centime.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;\">\n            <div style=\"display:flex;gap:12px;align-items:center;\">\n              <div style=\"width:56px;height:56px;border-radius:12px;flex-shrink:0;\"><image-slot id=\"detail-col-item-1\" placeholder=\"Photo\"><\u002Fimage-slot><\u002Fdiv>\n              <span style=\"font-size:14px;font-weight:600;\">Jardin des Plantes<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:center;\">\n              <div style=\"width:56px;height:56px;border-radius:12px;flex-shrink:0;\"><image-slot id=\"detail-col-item-2\" placeholder=\"Photo\"><\u002Fimage-slot><\u002Fdiv>\n              <span style=\"font-size:14px;font-weight:600;\">Place du Capitole<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:center;\">\n              <div style=\"width:56px;height:56px;border-radius:12px;flex-shrink:0;\"><image-slot id=\"detail-col-item-3\" placeholder=\"Photo\"><\u002Fimage-slot><\u002Fdiv>\n              <span style=\"font-size:14px;font-weight:600;\">Quais de la Garonne<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:center;\">\n              <div style=\"width:56px;height:56px;border-radius:12px;flex-shrink:0;\"><image-slot id=\"detail-col-item-4\" placeholder=\"Photo\"><\u002Fimage-slot><\u002Fdiv>\n              <span style=\"font-size:14px;font-weight:600;\">Marché du Capitole<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    page: 'home', catTab: 'evenements', supportScreen: 'form', detailType: null,\n    mobileMenuOpen: false,\n    filterWeekend: false, filterGratuit: false, filterExterieur: false,\n    catStatus: 'loaded',\n  };\n\n  toggleMobileMenu = () => this.setState(s => ({ mobileMenuOpen: !s.mobileMenuOpen }));\n\n  openDetailEvent = () => this.setState({ detailType: 'event' });\n  openDetailLieu = () => this.setState({ detailType: 'lieu' });\n  openDetailCollection = () => this.setState({ detailType: 'collection' });\n  closeDetail = () => this.setState({ detailType: null });\n\n  goHome = () => this.setState({ page: 'home', mobileMenuOpen: false });\n  goCatalogue = () => this.setState({ page: 'catalogue', mobileMenuOpen: false });\n  goSoutenir = () => this.setState({ page: 'soutenir', supportScreen: 'form', mobileMenuOpen: false });\n  goConfidentialite = () => this.setState({ page: 'confidentialite', mobileMenuOpen: false });\n  goCredits = () => this.setState({ page: 'credits', mobileMenuOpen: false });\n  goApropos = () => this.setState({ page: 'apropos', mobileMenuOpen: false });\n\n  setCatEvents = () => this.setState({ catTab: 'evenements' });\n  setCatLieux = () => this.setState({ catTab: 'lieux' });\n  setCatCollections = () => this.setState({ catTab: 'collections' });\n\n  runFilterCheck = () => {\n    const s = this.state;\n    const anyFilter = s.filterWeekend || s.filterGratuit || s.filterExterieur;\n    this.setState({ catStatus: 'loading' });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => {\n      if (anyFilter && this.state.filterWeekend && this.state.filterExterieur && this.state.catTab === 'lieux') {\n        this.setState({ catStatus: 'empty' });\n      } else {\n        this.setState({ catStatus: 'loaded' });\n      }\n    }, 700);\n  };\n\n  toggleFilterWeekend = () => { this.setState(s => ({ filterWeekend: !s.filterWeekend })); this.runFilterCheck(); };\n  toggleFilterGratuit = () => { this.setState(s => ({ filterGratuit: !s.filterGratuit })); this.runFilterCheck(); };\n  toggleFilterExterieur = () => { this.setState(s => ({ filterExterieur: !s.filterExterieur })); this.runFilterCheck(); };\n  resetFilters = () => this.setState({ filterWeekend: false, filterGratuit: false, filterExterieur: false, catStatus: 'loaded' });\n  retryCatalogue = () => this.runFilterCheck();\n\n  confirmSupport = () => this.setState({ supportScreen: 'thanks' });\n  closeSupport = () => this.setState({ supportScreen: 'form' });\n\n  renderVals() {\n    const s = this.state;\n    const active = '#A94A30', inactive = '#1F1C19';\n    return {\n      isHome: s.page === 'home',\n      isCatalogue: s.page === 'catalogue',\n      isSoutenir: s.page === 'soutenir',\n      isConfidentialite: s.page === 'confidentialite',\n      isCredits: s.page === 'credits',\n      isApropos: s.page === 'apropos',\n      colorApropos: s.page === 'apropos' ? active : inactive,\n      weightApropos: s.page === 'apropos' ? 700 : 400,\n      goApropos: this.goApropos,\n      isCatEvents: s.catTab === 'evenements',\n      isCatLieux: s.catTab === 'lieux',\n      isCatCollections: s.catTab === 'collections',\n      catalogueCount: s.catTab === 'evenements' ? 24 : s.catTab === 'lieux' ? 58 : 8,\n      isSupportForm: s.supportScreen === 'form',\n      isSupportThanks: s.supportScreen === 'thanks',\n      isDetailEvent: s.detailType === 'event',\n      isDetailLieu: s.detailType === 'lieu',\n      isDetailCollection: s.detailType === 'collection',\n      openDetailEvent: this.openDetailEvent,\n      openDetailLieu: this.openDetailLieu,\n      openDetailCollection: this.openDetailCollection,\n      closeDetail: this.closeDetail,\n      mobileMenuOpen: s.mobileMenuOpen,\n      toggleMobileMenu: this.toggleMobileMenu,\n      hasActiveFilters: s.filterWeekend || s.filterGratuit || s.filterExterieur,\n      toggleFilterWeekend: this.toggleFilterWeekend,\n      toggleFilterGratuit: this.toggleFilterGratuit,\n      toggleFilterExterieur: this.toggleFilterExterieur,\n      resetFilters: this.resetFilters,\n      retryCatalogue: this.retryCatalogue,\n      isCatLoading: s.catStatus === 'loading',\n      isCatEmpty: s.catStatus === 'empty',\n      isCatError: s.catStatus === 'error',\n      isCatLoaded: s.catStatus === 'loaded',\n      filterWeekendBg: s.filterWeekend ? '#C45C3E' : '#fff',\n      filterWeekendColor: s.filterWeekend ? '#fff' : '#1F1C19',\n      filterWeekendBorder: s.filterWeekend ? '#C45C3E' : '#EDE0CB',\n      filterGratuitBg: s.filterGratuit ? '#C45C3E' : '#fff',\n      filterGratuitColor: s.filterGratuit ? '#fff' : '#1F1C19',\n      filterGratuitBorder: s.filterGratuit ? '#C45C3E' : '#EDE0CB',\n      filterExterieurBg: s.filterExterieur ? '#C45C3E' : '#fff',\n      filterExterieurColor: s.filterExterieur ? '#fff' : '#1F1C19',\n      filterExterieurBorder: s.filterExterieur ? '#C45C3E' : '#EDE0CB',\n      colorCatalogue: s.page === 'catalogue' ? active : inactive,\n      weightCatalogue: s.page === 'catalogue' ? 700 : 400,\n      colorSoutenir: s.page === 'soutenir' ? active : inactive,\n      weightSoutenir: s.page === 'soutenir' ? 700 : 400,\n      colorCredits: (s.page === 'credits' || s.page === 'confidentialite') ? active : inactive,\n      weightCredits: (s.page === 'credits' || s.page === 'confidentialite') ? 700 : 400,\n      catEventsColor: s.catTab === 'evenements' ? active : '#756C60',\n      catEventsBorder: s.catTab === 'evenements' ? active : 'transparent',\n      catLieuxColor: s.catTab === 'lieux' ? active : '#756C60',\n      catLieuxBorder: s.catTab === 'lieux' ? active : 'transparent',\n      catCollectionsColor: s.catTab === 'collections' ? active : '#756C60',\n      catCollectionsBorder: s.catTab === 'collections' ? active : 'transparent',\n      goHome: this.goHome,\n      goCatalogue: this.goCatalogue,\n      goSoutenir: this.goSoutenir,\n      goConfidentialite: this.goConfidentialite,\n      goCredits: this.goCredits,\n      setCatEvents: this.setCatEvents,\n      setCatLieux: this.setCatLieux,\n      setCatCollections: this.setCatCollections,\n      confirmSupport: this.confirmSupport,\n      closeSupport: this.closeSupport,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
